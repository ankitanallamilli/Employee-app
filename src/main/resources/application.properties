server.port=8080

# Data tier: MySQL (override with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/empdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:empuser}
spring.datasource.password=${DB_PASSWORD:emppass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
