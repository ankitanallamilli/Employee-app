<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title}">Employee</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<main class="narrow">
  <h1 th:text="${title}">Employee</h1>
  <form th:action="@{/employees}" th:object="${employee}" method="post" class="card">
    <input type="hidden" th:field="*{id}"/>

    <label>Name
      <input type="text" th:field="*{name}"/>
      <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </label>

    <label>Email
      <input type="text" th:field="*{email}"/>
      <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </label>

    <label>Department
      <input type="text" th:field="*{department}"/>
      <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
    </label>

    <label>Salary
      <input type="number" step="0.01" th:field="*{salary}"/>
      <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
    </label>

    <div class="row">
      <button type="submit">Save</button>
      <a class="btn secondary" th:href="@{/employees}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
